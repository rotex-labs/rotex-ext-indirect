[package]
name = "rotex-ext-indirect"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Indirect draw extension for Rotex backends"
documentation = "https://docs.rs/rotex-ext-indirect"
repository = "https://github.com/rotex-labs/rotex-ext-indirect"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
vulkan = ["dep:rotex-vulkan"]
wgpu = ["dep:rotex-wgpu"]

[dependencies]
rotex-core = { version = "0.3.0", git = "https://github.com/rotex-labs/rotex-core", rev = "23ba8931416ce7b604d91604bf421c3b514271d8" }
rotex-types = { version = "0.3.0", git = "https://github.com/rotex-labs/rotex-core", rev = "23ba8931416ce7b604d91604bf421c3b514271d8" }
rotex-vulkan = { version = "0.2.0", git = "https://github.com/rotex-labs/rotex-vulkan", rev = "0568bdbe2daf7aed7614dc1cbe63360292bf6179", optional = true }
rotex-wgpu = { version = "0.2.0", git = "https://github.com/rotex-labs/rotex-wgpu", rev = "e2eafd6a94b8a55578c13152495d54688d8321ac", optional = true }
